[package]
name = "mierucover"
version = "1.0.0"
edition = "2024"
description = "Explorer thumbnails for comic and book archives (zip, rar, 7z, tar, epub, azw3, mobi)"
license = "MIT"
repository = "https://github.com/mlkami/mierucover"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = "0.9"
sevenz-rust2 = { version = "0.24", default-features = false }
unrar-rs = { version = "0.13", default-features = false, features = ["crypto-rust"] }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The libraries only decode one image's worth of data per thumbnail; size matters more than speed there.
[profile.release.package."*"]
opt-level = "s"
